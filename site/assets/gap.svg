<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="Helvetica, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .box{fill:#f6f8fa;stroke:#57606a;stroke-width:1.5;rx:8}
    .hot{fill:#fff1e5;stroke:#bc4c00;stroke-width:2}
    .t{fill:#24292f}
    .s{fill:#57606a;font-size:12px}
    .a{stroke:#57606a;stroke-width:1.5;fill:none;marker-end:url(#m)}
    .ah{stroke:#bc4c00;stroke-width:2;fill:none;marker-end:url(#mh)}
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#57606a"/></marker>
    <marker id="mh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#bc4c00"/></marker>
  </defs>
  <rect x="0" y="0" width="880" height="420" fill="#ffffff"/>
  <text x="440" y="28" text-anchor="middle" class="t" font-size="17" font-weight="bold">One MCPB extension, two different tool descriptions</text>

  <!-- registry -->
  <rect class="box" x="20" y="60" width="200" height="80"/>
  <text x="120" y="88" text-anchor="middle" class="t" font-weight="bold">Official MCP registry</text>
  <text x="120" y="108" text-anchor="middle" class="s">pins release URL + sha256</text>
  <text x="120" y="126" text-anchor="middle" class="s">at registration time</text>

  <!-- asset -->
  <rect class="hot" x="20" y="200" width="200" height="90" rx="8"/>
  <text x="120" y="228" text-anchor="middle" class="t" font-weight="bold">Release asset (.mcpb)</text>
  <text x="120" y="248" text-anchor="middle" class="s">mutable: 5 of 536 re-uploaded</text>
  <text x="120" y="264" text-anchor="middle" class="s">after registration, 15 stale hashes</text>
  <path class="a" d="M120,140 L120,198"/>

  <!-- manifest -->
  <rect class="box" x="300" y="80" width="250" height="90"/>
  <text x="425" y="106" text-anchor="middle" class="t" font-weight="bold">manifest.json</text>
  <text x="425" y="126" text-anchor="middle" class="s">"Send (or draft) a WhatsApp message"</text>
  <text x="425" y="146" text-anchor="middle" class="s">median 57 chars, reviewed at install</text>
  <path class="a" d="M220,230 C260,230 260,125 298,125"/>

  <!-- binary -->
  <rect class="hot" x="300" y="230" width="250" height="110" rx="8"/>
  <text x="425" y="256" text-anchor="middle" class="t" font-weight="bold">compiled Go server</text>
  <text x="425" y="276" text-anchor="middle" class="s">tools/list description recovered by</text>
  <text x="425" y="292" text-anchor="middle" class="s">disassembling the registration call sites:</text>
  <text x="425" y="310" text-anchor="middle" class="s">median 210 chars, with "always / call X first"</text>
  <text x="425" y="326" text-anchor="middle" class="s">instructions that are not in the manifest</text>
  <path class="a" d="M220,260 L298,280"/>

  <!-- user / model -->
  <rect class="box" x="640" y="85" width="210" height="80"/>
  <text x="745" y="118" text-anchor="middle" class="t" font-weight="bold">User / directory</text>
  <text x="745" y="138" text-anchor="middle" class="s">approves the short text</text>
  <path class="a" d="M550,125 L638,125"/>

  <rect class="hot" x="640" y="245" width="210" height="80" rx="8"/>
  <text x="745" y="278" text-anchor="middle" class="t" font-weight="bold">Model context</text>
  <text x="745" y="298" text-anchor="middle" class="s">receives the long text</text>
  <path class="ah" d="M550,285 L638,285"/>

  <text x="440" y="390" text-anchor="middle" class="t">In a manually validated sample, 20 of 30 correctly recovered tools (67%) serve a different description than the manifest.</text>
  <text x="440" y="408" text-anchor="middle" class="s">No malicious content was found in the gap. The point is that a reviewer of the manifest cannot know.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
