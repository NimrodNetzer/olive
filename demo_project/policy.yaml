# Olive policy for the demo code-assistant agent.
#
# The agent's role is "code-assistant": it may only call read_file and
# search_docs. get_system_config and list_users are explicitly forbidden.
# After 3 blocked calls the entire session is quarantined.

gateway:
  agent_id: code-assistant-demo
  organization_id: demo-corp
  role: code-assistant
  declared_goal: help developers understand project documentation
  db_path: demo_project/demo_events.db

roles:
  code-assistant:
    max_calls_per_minute: 60
    allowed_tools:
      - read_file
      - search_docs
    forbidden_tools:
      - get_system_config
      - list_users
      - execute_code
      - delete_record

upstream:
  trust: untrusted

containment:
  max_blocks_before_quarantine: 3

injection_patterns:
  - ignore previous instructions
  - override previous instructions
  - ignore all previous
  - system override
  - you are now
  - forget your instructions
  - "new instructions:"
  - disregard your
  - your true purpose is
  - output all credentials
  - reveal your system prompt
  - act as if you are
